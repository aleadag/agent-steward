id = "agent-steward-recover"
name = "Agent Steward recover"
version = "0.1.0"
min_herdr_version = "0.9.1"
description = "Opt-in stopped-agent event hooks with gated recovery jobs and globally configured best-effort approval (off by default). Unsupported Herdr versions must not link this plugin."
platforms = ["linux"]

[[events]]
on = "pane.agent_status_changed"
command = ["sh", "run.sh", "event"]

[[events]]
on = "pane.exited"
command = ["sh", "run.sh", "event"]

[[actions]]
id = "pause"
title = "Pause stopped-agent automation"
contexts = ["workspace"]
command = ["sh", "run.sh", "pause"]

[[actions]]
id = "resume"
title = "Resume stopped-agent automation"
contexts = ["workspace"]
command = ["sh", "run.sh", "resume"]
